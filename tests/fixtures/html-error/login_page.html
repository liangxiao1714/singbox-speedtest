<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>订阅已过期 - 请登录</title>
<style>
body{font-family:"Microsoft YaHei",sans-serif;background:#f5f5f5;margin:0;padding:40px;}
.box{max-width:420px;margin:40px auto;background:#fff;border-radius:8px;padding:32px;box-shadow:0 2px 8px rgba(0,0,0,.08);}
h1{color:#e74c3c;font-size:20px;margin:0 0 12px;}
p{color:#555;line-height:1.6;}
form{margin-top:20px;}
input{width:100%;padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:4px;box-sizing:border-box;}
button{width:100%;padding:10px;background:#3498db;color:#fff;border:0;border-radius:4px;cursor:pointer;}
</style>
</head>
<body>
<div class="box">
<h1>订阅已过期</h1>
<p>您的订阅已过期或未找到对应节点，请登录用户中心续费后重试。</p>
<p>如有疑问请联系客服。</p>
<form action="/login" method="post">
<input type="email" name="email" placeholder="邮箱">
<input type="password" name="password" placeholder="密码">
<button type="submit">登录续费</button>
</form>
</div>
</body>
</html>
